name: Chief Inspector - 24/7 Cloud Quality & Verification Bot

on:
  schedule:
    # Run every 6 hours (01:00, 07:00, 13:00, 19:00 UTC) completely in the cloud
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  cloud-audit:
    name: Autonomous Production Quality & Verification Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Chief Inspector Audit Suite
        run: |
          node scripts/chief-inspector.mjs

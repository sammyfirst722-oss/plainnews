name: Graveyard Shift - 24/7 Cloud Uptime & Health Monitor

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) completely in the cloud
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  uptime-and-health:
    name: 24/7 Cloud Site Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Ping SimplyBigNews Production Health Endpoint
        run: |
          echo "Checking SimplyBigNews Production Health..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://plainnews.vercel.app/api/health)
          echo "Health Endpoint HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::SimplyBigNews health endpoint returned $HTTP_STATUS instead of 200!"
            exit 1
          fi
          echo "SimplyBigNews is 100% operational!"

      - name: Verify Guides Directory Live
        run: |
          GUIDES_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://plainnews.vercel.app/guides)
          echo "Guides Directory HTTP Status: $GUIDES_STATUS"
          if [ "$GUIDES_STATUS" -ne 200 ] && [ "$GUIDES_STATUS" -ne 302 ]; then
            echo "::warning::Guides directory returned $GUIDES_STATUS"
          fi

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — PlainNews</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #fdfbf7;
      color: #1c1917;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background-color: #ffffff;
      border: 2px solid #059669;
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin: 16px 0 8px 0;
      color: #059669;
    }
    p {
      color: #57534e;
      font-size: 16px;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    button {
      background-color: #059669;
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
      border: none;
      padding: 12px 24px;
      border-radius: 14px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 48px;">📰</div>
    <h1>You are Currently Offline</h1>
    <p>PlainNews needs an internet connection to refresh the latest daily news stories.</p>
    <button onclick="window.location.reload()">Check Connection</button>
  </div>
</body>
</html>
